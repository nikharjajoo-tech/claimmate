# docker compose up --build   ->   http://localhost:8000  (adjuster view: /#/adjuster)
services:
  claimvoice:
    build: .
    ports:
      - "8000:8000"
    env_file: .env          # GOOGLE_API_KEY, GROQ_API_KEY, CLAIMVOICE_ADJUSTER_PASSCODE, ...
    environment:
      # A fixed secret keeps adjuster sign-ins valid across container restarts. Override in .env.
      CLAIMVOICE_SESSION_SECRET: ${CLAIMVOICE_SESSION_SECRET:-change-me-in-env}
    volumes:
      - claimvoice-data:/app/backend/data
    restart: unless-stopped

volumes:
  claimvoice-data:
