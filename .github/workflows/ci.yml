name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      # Every test uses fakes; no API keys or network calls are needed.
      - run: pytest -q -v --durations=10

  # The database tests again, on a real PostgreSQL server (hosted database: Neon, PRD D9).
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: claimvoice
          POSTGRES_PASSWORD: claimvoice
          POSTGRES_DB: claimvoice_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U claimvoice"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      CLAIMVOICE_TEST_DATABASE_URL: postgresql://claimvoice:claimvoice@localhost:5432/claimvoice_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_migrations.py tests/test_repository.py tests/test_api.py tests/test_adjuster.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, postgres, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t claimvoice:ci .
      # Start it the way Render does (port from $PORT) and wait for the health check.
      - name: Container starts and serves the app
        run: |
          docker run -d --name app -e PORT=10000 -p 10000:10000 claimvoice:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10000/api/health; then echo; break; fi
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:10000/ && echo "UI served"
          docker inspect --format '{{.State.Health.Status}}' app || true
      - if: failure()
        run: docker logs app

  # Deploy to Render only from main, only after every test job passed. The deploy hook is an encrypted
  # repository secret that can trigger deploys of this one service and nothing else.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, postgres, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency: deploy-production
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "No RENDER_DEPLOY_HOOK_URL secret; skipping deploy."; exit 0; fi
          curl -fsS -X POST "$HOOK" -o /dev/null && echo "Deploy triggered"
      - name: Wait until the live site runs this commit
        run: |
          want="${GITHUB_SHA:0:7}"
          for i in $(seq 1 60); do
            live=$(curl -fsS --max-time 30 https://claimvoice-v2rh.onrender.com/api/health | python3 -c "import json,sys; print(json.load(sys.stdin).get('commit') or '')" || true)
            echo "attempt $i: live commit=${live:-unknown}, want=$want"
            if [ "$live" = "$want" ]; then echo "Live."; exit 0; fi
            sleep 15
          done
          echo "The new commit did not go live within 15 minutes."; exit 1
