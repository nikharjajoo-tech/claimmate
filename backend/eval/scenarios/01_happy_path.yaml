      route: needs_docs
      facts:
        policyholder_name: Aisha Karim
        policy_number: RN-7702
        contact: "512-555-0199"
        date_of_loss: "2026-09-19"
        loss_location: Austin
        loss_description: Laptop stolen at a coffee shop.
        estimated_loss_usd: 1800
      evidence: {police_report: available, ownership_proof: available}
      rules_not_fired: [SAFE-001, POLICY-001, EVID-001]

  - id: hp-04
    title: Flight cancelled by hurricane
    tags: [travel]
    turns:
      - claimant: "Hi, this is Daniel Ortiz, travel policy TR-3391. My flight from Miami to Lisbon on September 12th got cancelled because of the hurricane."
      - agent: "I'm sorry. What did that cost you?"
      - claimant: "I lost two prepaid hotel nights and a tour, about 2,400 dollars total. I have the airline's cancellation email and all the hotel receipts. The airline hasn't refunded anything yet."
      - agent: "What's the best way to reach you?"
      - claimant: "daniel.ortiz@example.com."
    expected:
      claim_type: travel_disruption
      route: needs_docs
      facts:
        policyholder_name: Daniel Ortiz
        policy_number: TR-3391
        contact: daniel.ortiz@example.com
        date_of_loss: "2026-09-12"
        loss_location: Miami
        loss_description: Flight cancelled due to hurricane; lost prepaid hotel and tour.
        estimated_loss_usd: 2400
      evidence: {carrier_notice: available, expense_receipt: available, refund_document: missing}
      rules_not_fired: [SAFE-001, POLICY-001]

  - id: hp-05
    title: Urgent care reimbursement for an illness
    tags: [medical]
    turns:
      - claimant: "I want to submit an urgent care bill for reimbursement. Grace Liu, member number MD-4418."
      - agent: "Sure. When was the visit?"
      - claimant: "September 2nd, at the CityMed urgent care in Portland. It was a sinus infection, I'm fully recovered now."
      - agent: "How much did you pay, and what documents do you have?"
      - claimant: "I paid 640 dollars by card and I have the itemized bill and my card receipt. I haven't received the explanation of benefits from my primary insurance yet."
      - agent: "And the best contact for you?"
      - claimant: "grace.liu@example.com."
    expected:
      claim_type: medical_reimbursement
      route: needs_docs
      facts:
        policyholder_name: Grace Liu
        policy_number: MD-4418
        contact: grace.liu@example.com
        date_of_loss: "2026-09-02"
        loss_location: Portland
        loss_description: Urgent care visit for a sinus infection.
        estimated_loss_usd: 640
      evidence: {medical_bill: available, payment_proof: available, explanation_of_benefits: missing}
      rules_not_fired: [SAFE-001, POLICY-001]

  - id: hp-06
    title: Burst pipe, every document captured on camera
    tags: [home, captures, ready]
    turns:
      - claimant: "Hi, I'm Priya Nair, policy HO-31552. A pipe under our kitchen sink in Seattle burst on Tuesday the 22nd."
      - agent: "Is everyone okay?"
      - claimant: "Yes, no one was hurt. A water mitigation company already dried everything out."
      - agent: "Do you have documents for the damage?"
      - claimant: "I have photos, the drying company's invoice, and a repair quote for 4,200 dollars. I'll show them on camera."
      - agent: "Thank you, I've captured those. What's the best number for the adjuster?"
      - claimant: "206-555-0172."
    captures:
      - {capture_id: cap-hp06-1, document_types: [damage_photo], caption: "Warped cabinet base and water-stained floor under a kitchen sink.", confirmed: true}
      - {capture_id: cap-hp06-2, document_types: [mitigation_invoice], caption: "Invoice from a water mitigation company for drying services.", confirmed: true}
      - {capture_id: cap-hp06-3, document_types: [repair_estimate], caption: "Contractor repair estimate totaling $4,200.", confirmed: true}
    expected:
      claim_type: home_water_damage
      route: ready_for_adjuster
      facts:
        policyholder_name: Priya Nair
        policy_number: HO-31552
        contact: "206-555-0172"
        date_of_loss: "2026-09-22"
        loss_location: Seattle
        loss_description: Pipe under the kitchen sink burst.
        estimated_loss_usd: 4200
      safety: [{category: injury, status: absent}]
      evidence: {damage_photo: available, mitigation_invoice: available, repair_estimate: available}
      rules_not_fired: [DOC-001, INTAKE-001, POLICY-001]

