      - agent: "That's frustrating. Did you file a police report?"
      - claimant: "Yes, I filed one that evening and I have the case number. I also still have the purchase receipt with the serial number. It was about 1,800 dollars."
      - agent: "How can the adjuster reach you?"
      - claimant: "512-555-0199."
    expected:
