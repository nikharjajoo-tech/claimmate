      - agent: "Is anyone hurt, and is the area safe?"
      - claimant: "Nobody was hurt and we're staying away from the garage. I took photos. A roofer thinks it's about 6,500 dollars but I don't have anything in writing."
      - agent: "Best contact?"
      - claimant: "Same cell, 720-555-0148."
    expected:
      claim_type: other
      route: needs_docs
      facts:
        policyholder_name: Elena Brooks
        policy_number: HO-20417
        contact: "720-555-0148"
        date_of_loss: "2026-09-18"
        loss_location: Denver
