      - agent: "Is anyone hurt?"
      - claimant: "No injuries. The police did an exchange form, and the other driver gave me her insurance card. I got a body shop estimate for 3,100 dollars. Let me hold everything up to the camera."
      - agent: "Got them. And your phone number?"
      - claimant: "312-555-0110."
    captures:
      - {capture_id: cap-hp07-1, document_types: [damage_photo], caption: "Dented rear passenger door of a gray sedan.", confirmed: true}
      - {capture_id: cap-hp07-2, document_types: [police_report], caption: "Police information exchange form with a case number.", confirmed: true}
      - {capture_id: cap-hp07-3, document_types: [witness_details], caption: "Insurance card listing the other driver's name and policy.", confirmed: true}
      - {capture_id: cap-hp07-4, document_types: [repair_estimate], caption: "Body shop estimate for $3,100.", confirmed: true}
    expected:
      claim_type: auto_collision
      route: ready_for_adjuster
      facts:
        policyholder_name: Omar Haddad
        policy_number: AU-66001
        contact: "312-555-0110"
        date_of_loss: "2026-09-20"
        loss_location: Chicago
        loss_description: Another car backed into the parked vehicle.
        estimated_loss_usd: 3100
      safety: [{category: injury, status: absent}]
      evidence: {police_report: available, witness_details: available, repair_estimate: available}
      rules_not_fired: [DOC-001, SAFE-001]

