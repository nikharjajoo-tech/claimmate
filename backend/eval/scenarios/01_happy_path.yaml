# Clean claims across every claim type. Reference date for all scenarios: 2026-09-24 (Thursday).
category: happy_path
scenarios:
  - id: hp-01
    title: Basement flood, spelled-out policy number, relative date
    tags: [home, relative_date, voice_spelling]
    turns:
      - agent: "I can start your claim while we talk. First, is everyone safe?"
      - claimant: "Yes, everyone's fine, nobody was hurt. I'm Elena Brooks, policy H O 2 0 4 1 7."
      - agent: "Thanks Elena. What happened?"
      - claimant: "Last night our sump pump failed during the storm and the finished basement in our Denver house flooded. The carpet is soaked and the bottom of the drywall is wet."
      - agent: "I'm sorry. Do you have any photos of the damage?"
      - claimant: "Yes, I took photos on my phone before we moved anything. I don't have a contractor estimate yet, I'm calling one tomorrow."
      - agent: "What's the best way for the adjuster to reach you?"
      - claimant: "My cell, 720-555-0148. I'd guess the damage is around 9,000 dollars."
    expected:
      claim_type: home_water_damage
      route: needs_docs
      facts:
        policyholder_name: Elena Brooks
        policy_number: HO-20417
        contact: "720-555-0148"
        date_of_loss: "2026-09-23"
        loss_location: Denver
        loss_description: Sump pump failed and flooded the finished basement.
        estimated_loss_usd: 9000
      safety: [{category: injury, status: absent}]
      evidence: {damage_photo: available, repair_estimate: planned}
      rules_fired: [DOC-001]
      rules_not_fired: [SAFE-001, POLICY-001]

  - id: hp-02
    title: Rear-ended at a light, police came
    tags: [auto, relative_date]
    turns:
      - claimant: "Hi, um, I got rear-ended on Monday and I need to open a claim. Sofia Martinez, policy A U 7 2 2 1 4."
      - agent: "I'm sorry to hear that. Is anyone hurt?"
      - claimant: "No, I'm fine, nobody was hurt. It was at a red light on Camelback Road in Phoenix. The other guy just didn't stop."
      - agent: "Did police come to the scene?"
      - claimant: "Yeah, they came and gave me a report number. I also took pictures of both cars. I haven't gotten a repair estimate yet."
      - agent: "What's the best email or phone for the adjuster?"
      - claimant: "Email is sofia.m@example.com."
    expected:
      claim_type: auto_collision
      route: needs_docs
      facts:
        policyholder_name: Sofia Martinez
        policy_number: AU-72214
        contact: sofia.m@example.com
        date_of_loss: "2026-09-21"
        loss_location: Phoenix
        loss_description: Rear-ended while stopped at a red light.
      safety: [{category: injury, status: absent}]
      evidence: {police_report: available, damage_photo: available, repair_estimate: missing}
      rules_not_fired: [SAFE-001, POLICY-001]

