[project]
name = "claimmate"
version = "0.1.0"
description = "ClaimMate: a personal AI claim assistant (real-time voice AI agent for insurance claim intake)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "langgraph>=1.0",
    "google-genai>=2.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "turso_serverless>=0.1.0",
    "certifi",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-timeout>=2.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.rules" = ["*.yaml"]
"app.domain" = ["wordings/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A hung test fails with every thread's stack instead of stalling CI silently.
timeout = 120
timeout_method = "thread"
