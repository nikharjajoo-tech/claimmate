[project]
name = "claimvoice"
version = "0.1.0"
description = "Real-time voice AI agent for insurance claim intake"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.rules" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
